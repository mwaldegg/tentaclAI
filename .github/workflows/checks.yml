name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # stage 1: syntax, ShellCheck, site data, JSON/YAML, unit tests, every tentacontrol page rendered with dummy data
      - name: Quick checks and unit tests
        run: scripts/test-quick.sh

  # end-to-end: privilege separation, svc through the gateway, network rules, pages (scripts/test-sandbox.sh)
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Sandbox and egress tests
        run: scripts/test-sandbox.sh
