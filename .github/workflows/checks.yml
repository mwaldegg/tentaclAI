name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # stage 1: syntax, ShellCheck, site data, JSON/YAML, unit tests, every tentacontrol page rendered with dummy data
      - name: Quick checks and unit tests
        run: scripts/test-quick.sh

  # end-to-end: privilege separation, svc through the gateway, network rules, pages (scripts/test-sandbox.sh)
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # image layers from the Actions cache – without it every run builds the three images from scratch (~1 min)
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v4   # hands the cache endpoint to `docker compose build` (type=gha)
      - name: Sandbox and egress tests
        run: scripts/test-sandbox.sh
        env:
          TC_BUILD_CACHE: gha
